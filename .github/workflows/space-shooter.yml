name: Generate Space Shooter

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/space-shooter.yml

concurrency:
  group: space-shooter
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate game
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pip install --disable-pip-version-check "gh-space-shooter==2.0.5"
          mkdir dist
          gh-space-shooter "${{ github.repository_owner }}" --output dist/space-shooter.gif --strategy random --fps 30

      # The GIF lives on its own branch because snake.yml force-replaces the
      # `output` branch on every run, which deletes anything else stored there.
      # Force-pushing a single commit keeps daily GIFs out of the repo history.
      - name: Publish to output-shooter branch
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b output-shooter
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add space-shooter.gif
          git commit -q -m "Update space shooter"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" output-shooter
